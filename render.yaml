services:
  - type: web
    name: helpscout-triage
    env: python
    buildCommand: pip install -r requirements.txt
    # Keep --workers 1: the daily triage scheduler runs in-process, and more
    # workers would each start their own scheduler (duplicate 8:30 AM runs).
    startCommand: gunicorn --workers 1 --threads 4 --chdir scripts app:app
    envVars:
      - key: HELPSCOUT_APP_ID
        sync: false
      - key: HELPSCOUT_APP_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
